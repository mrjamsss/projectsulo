<ion-item button (click)="onSelect()" lines="full" class="application-item" detail="false">
  <ion-avatar slot="start" class="applicant-avatar">
    <ion-text class="avatar-letter">{{ application().avatarChar }}</ion-text>
  </ion-avatar>

  <ion-grid class="applicant-grid ion-no-padding">
    <ion-row class="ion-align-items-center">
      <ion-col size="12" size-md="4">
        <ion-label class="applicant-label">
          <ion-text color="dark" class="applicant-name">
            {{ application().applicantName }}
          </ion-text>
          <ion-note class="applicant-sub">
            {{ application().appNo }} • {{ application().barangay }}
          </ion-note>
        </ion-label>
      </ion-col>

      <ion-col size="6" size-md="3" class="ion-hide-sm-down">
        <ion-note class="category-note">
          <ion-icon name="document-text-outline" class="cat-icon"></ion-icon>
          {{ application().category }}
        </ion-note>
      </ion-col>

      <ion-col size="6" size-md="3" class="ion-text-md-center">
        <ion-badge [color]="getStatusColor(application().status)" class="status-badge">
          {{ application().status }}
        </ion-badge>
      </ion-col>

      <ion-col size="6" size-md="2" class="ion-text-end">
        <ion-note class="application-date">
          {{ application().date }}
        </ion-note>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-icon slot="end" name="chevron-forward-outline" color="medium" class="arrow-icon"></ion-icon>
</ion-item>
